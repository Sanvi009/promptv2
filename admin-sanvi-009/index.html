<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Prompt Library</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Login */
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: #1a1a1a;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .login-box h1 {
            font-size: 24px;
            margin-bottom: 30px;
            text-align: center;
            color: #a78bfa;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }

        .login-box input:focus {
            outline: none;
            border-color: #a78bfa;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: #a78bfa;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-box button:hover {
            background: #8b5cf6;
        }

        .login-error {
            color: #ef4444;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        /* Dashboard */
        .dashboard {
            display: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: #a78bfa;
        }

        .header button {
            padding: 10px 20px;
            background: #ef4444;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #333;
        }

        .stat-card h3 {
            font-size: 13px;
            color: #888;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: 700;
            color: #a78bfa;
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .actions button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn-add {
            background: #10b981;
            color: #000;
        }

        .btn-add:hover {
            background: #059669;
        }

        .btn-refresh {
            background: #374151;
            color: #fff;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filters input,
        .filters select {
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
        }

        .filters input:focus,
        .filters select:focus {
            outline: none;
            border-color: #a78bfa;
        }

        .filters input {
            flex: 1;
            min-width: 200px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            text-align: left;
            padding: 14px;
            background: #0f0f0f;
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td {
            padding: 12px 14px;
            border-bottom: 1px solid #2a2a2a;
            font-size: 13px;
            vertical-align: middle;
        }

        tr:hover td {
            background: #222;
        }

        .prompt-title {
            font-weight: 600;
            color: #fff;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }

        .badge-published {
            background: #10b98133;
            color: #10b981;
        }

        .badge-draft {
            background: #f59e0b33;
            color: #f59e0b;
        }

        .badge-archived {
            background: #6b728033;
            color: #9ca3af;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn-edit {
            background: #3b82f6;
            color: #fff;
        }

        .btn-edit:hover {
            background: #2563eb;
        }

        .btn-delete {
            background: #ef4444;
            color: #fff;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: flex-start;
            padding: 40px;
            overflow-y: auto;
        }

        .modal {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 700px;
            border: 1px solid #333;
        }

        .modal h2 {
            margin-bottom: 25px;
            color: #a78bfa;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #888;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #a78bfa;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 25px;
        }

        .btn-save {
            background: #10b981;
            color: #000;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-cancel {
            background: #374151;
            color: #fff;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-upload {
            background: #3b82f6;
            color: #fff;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .image-preview {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            margin-top: 10px;
            border-radius: 8px;
            display: none;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 14px 20px;
            background: #10b981;
            color: #000;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            z-index: 2000;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .loading-text {
            text-align: center;
            padding: 40px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login -->
        <div class="login-box" id="loginBox">
            <h1>🔐 Admin Panel</h1>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()">Login</button>
            <div class="login-error" id="loginError">Invalid credentials</div>
        </div>

        <!-- Dashboard -->
        <div class="dashboard" id="dashboard">
            <div class="header">
                <h1>⚡ Prompt Library Admin</h1>
                <button onclick="logout()">Logout</button>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <h3>Total Prompts</h3>
                    <div class="number" id="totalPrompts">0</div>
                </div>
                <div class="stat-card">
                    <h3>Published</h3>
                    <div class="number" id="totalPublished" style="color: #10b981;">0</div>
                </div>
                <div class="stat-card">
                    <h3>Total Views</h3>
                    <div class="number" id="totalViews">0</div>
                </div>
                <div class="stat-card">
                    <h3>Total Loves</h3>
                    <div class="number" id="totalLoves" style="color: #ef4444;">0</div>
                </div>
            </div>

            <div class="actions">
                <button class="btn-add" onclick="openAddModal()">+ Add New Prompt</button>
                <button class="btn-refresh" onclick="loadPrompts()">🔄 Refresh</button>
            </div>

            <div class="filters">
                <input type="text" id="searchInput" placeholder="Search prompts..." oninput="loadPrompts()">
                <select id="categoryFilter" onchange="loadPrompts()">
                    <option value="">All Categories</option>
                    <option value="Photorealism">Photorealism</option>
                    <option value="Anime">Anime</option>
                    <option value="3D Render">3D Render</option>
                    <option value="Cinematic">Cinematic</option>
                    <option value="Fantasy">Fantasy</option>
                    <option value="Abstract">Abstract</option>
                    <option value="Other">Other</option>
                </select>
                <select id="statusFilter" onchange="loadPrompts()">
                    <option value="">All Status</option>
                    <option value="published">Published</option>
                    <option value="draft">Draft</option>
                    <option value="archived">Archived</option>
                </select>
            </div>

            <div id="promptsTable">
                <div class="loading-text">Loading prompts...</div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle">Add New Prompt</h2>
            <input type="hidden" id="editId">
            
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="editTitle" placeholder="Enter prompt title">
            </div>
            
            <div class="form-group">
                <label>Description</label>
                <textarea id="editDescription" placeholder="Describe the prompt, your experience, tips..." rows="4"></textarea>
            </div>
            
            <div class="form-group">
                <label>Prompt Text</label>
                <textarea id="editPrompt" placeholder="The actual AI prompt..." rows="3"></textarea>
            </div>
            
            <div class="form-group">
                <label>Guidelines</label>
                <textarea id="editGuideline" placeholder="Parameters, CFG scale, model suggestions..." rows="3"></textarea>
            </div>
            
            <div class="form-group">
                <label>Category</label>
                <select id="editCategory">
                    <option value="">Select category</option>
                    <option value="Photorealism">Photorealism</option>
                    <option value="Anime">Anime</option>
                    <option value="3D Render">3D Render</option>
                    <option value="Cinematic">Cinematic</option>
                    <option value="Fantasy">Fantasy</option>
                    <option value="Abstract">Abstract</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Status</label>
                <select id="editStatus">
                    <option value="published">Published</option>
                    <option value="draft">Draft</option>
                    <option value="archived">Archived</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Image</label>
                <input type="file" id="editImage" accept="image/*" onchange="previewImage()">
                <img id="imagePreview" class="image-preview">
                <input type="hidden" id="editImageUrl">
            </div>
            
            <div class="form-group">
                <label>View Count</label>
                <input type="number" id="editViewCount" value="0">
            </div>
            
            <div class="form-group">
                <label>Love Count</label>
                <input type="number" id="editLoveCount" value="0">
            </div>
            
            <div class="form-group">
                <label>Save Count</label>
                <input type="number" id="editSaveCount" value="0">
            </div>
            
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-save" onclick="savePrompt()">Save Prompt</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        const API_BASE = 'https://prompt-api.rafiqul2121islam.workers.dev/';
        let token = localStorage.getItem('admin_token');
        let allPrompts = [];

        // Check if already logged in
        if (token) {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadPrompts();
        }

        // ============ AUTH ============
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch(`${API_BASE}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (data.token) {
                    token = data.token;
                    localStorage.setItem('admin_token', token);
                    document.getElementById('loginBox').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    loadPrompts();
                } else {
                    document.getElementById('loginError').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function logout() {
            localStorage.removeItem('admin_token');
            token = null;
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
        }

        // ============ LOAD PROMPTS ============
        async function loadPrompts() {
            const search = document.getElementById('searchInput').value;
            const category = document.getElementById('categoryFilter').value;
            const status = document.getElementById('statusFilter').value;
            
            let url = `${API_BASE}/api/prompts?`;
            if (search) url += `search=${encodeURIComponent(search)}&`;
            if (category) url += `category=${encodeURIComponent(category)}&`;
            if (status) url += `status=${encodeURIComponent(status)}&`;
            
            try {
                const res = await fetch(url);
                allPrompts = await res.json();
                renderTable(allPrompts);
                updateStats(allPrompts);
            } catch (err) {
                document.getElementById('promptsTable').innerHTML = '<div class="loading-text">Error loading prompts</div>';
            }
        }

        // ============ UPDATE STATS ============
        function updateStats(prompts) {
            document.getElementById('totalPrompts').textContent = prompts.length;
            
            const published = prompts.filter(p => p.status === 'published');
            document.getElementById('totalPublished').textContent = published.length;
            
            const totalViews = prompts.reduce((sum, p) => sum + (p.view_count || 0), 0);
            document.getElementById('totalViews').textContent = totalViews.toLocaleString();
            
            const totalLoves = prompts.reduce((sum, p) => sum + (p.love_count || 0), 0);
            document.getElementById('totalLoves').textContent = totalLoves.toLocaleString();
        }

        // ============ RENDER TABLE ============
        function renderTable(prompts) {
            if (prompts.length === 0) {
                document.getElementById('promptsTable').innerHTML = '<div class="loading-text">No prompts found</div>';
                return;
            }
            
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>❤️</th>
                            <th>👁️</th>
                            <th>💾</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            prompts.forEach(p => {
                const statusClass = p.status === 'published' ? 'badge-published' : p.status === 'draft' ? 'badge-draft' : 'badge-archived';
                
                html += `
                    <tr>
                        <td>#${p.id}</td>
                        <td class="prompt-title" title="${escapeHtml(p.title)}">${escapeHtml(p.title)}</td>
                        <td>${p.category || '-'}</td>
                        <td><span class="badge ${statusClass}">${p.status}</span></td>
                        <td>${p.love_count || 0}</td>
                        <td>${p.view_count || 0}</td>
                        <td>${p.save_count || 0}</td>
                        <td>${p.created_at ? new Date(p.created_at).toLocaleDateString() : '-'}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-sm btn-edit" onclick="openEditModal(${p.id})">Edit</button>
                                <button class="btn-sm btn-delete" onclick="deletePrompt(${p.id})">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            document.getElementById('promptsTable').innerHTML = html;
        }

        // ============ MODAL ============
        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Add New Prompt';
            document.getElementById('editId').value = '';
            document.getElementById('editTitle').value = '';
            document.getElementById('editDescription').value = '';
            document.getElementById('editPrompt').value = '';
            document.getElementById('editGuideline').value = '';
            document.getElementById('editCategory').value = '';
            document.getElementById('editStatus').value = 'published';
            document.getElementById('editImageUrl').value = '';
            document.getElementById('editViewCount').value = '0';
            document.getElementById('editLoveCount').value = '0';
            document.getElementById('editSaveCount').value = '0';
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('editImage').value = '';
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function openEditModal(id) {
            const prompt = allPrompts.find(p => p.id === id);
            if (!prompt) return;
            
            document.getElementById('modalTitle').textContent = 'Edit Prompt';
            document.getElementById('editId').value = prompt.id;
            document.getElementById('editTitle').value = prompt.title;
            document.getElementById('editDescription').value = prompt.description;
            document.getElementById('editPrompt').value = prompt.prompt;
            document.getElementById('editGuideline').value = prompt.guideline || '';
            document.getElementById('editCategory').value = prompt.category || '';
            document.getElementById('editStatus').value = prompt.status;
            document.getElementById('editImageUrl').value = prompt.image_url || '';
            document.getElementById('editViewCount').value = prompt.view_count || 0;
            document.getElementById('editLoveCount').value = prompt.love_count || 0;
            document.getElementById('editSaveCount').value = prompt.save_count || 0;
            
            if (prompt.image_url) {
                document.getElementById('imagePreview').src = prompt.image_url;
                document.getElementById('imagePreview').style.display = 'block';
            } else {
                document.getElementById('imagePreview').style.display = 'none';
            }
            
            document.getElementById('editImage').value = '';
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        function previewImage() {
            const file = document.getElementById('editImage').files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('imagePreview').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        // ============ SAVE PROMPT ============
        async function savePrompt() {
            const id = document.getElementById('editId').value;
            const title = document.getElementById('editTitle').value;
            const description = document.getElementById('editDescription').value;
            const prompt = document.getElementById('editPrompt').value;
            const guideline = document.getElementById('editGuideline').value;
            const category = document.getElementById('editCategory').value;
            const status = document.getElementById('editStatus').value;
            const viewCount = parseInt(document.getElementById('editViewCount').value) || 0;
            const loveCount = parseInt(document.getElementById('editLoveCount').value) || 0;
            const saveCount = parseInt(document.getElementById('editSaveCount').value) || 0;
            
            if (!title || !description || !prompt) {
                showToast('Please fill required fields', 'error');
                return;
            }
            
            let imageUrl = document.getElementById('editImageUrl').value;
            
            // Upload image if selected
            const imageFile = document.getElementById('editImage').files[0];
            if (imageFile) {
                const formData = new FormData();
                formData.append('image', imageFile);
                
                try {
                    const uploadRes = await fetch(`${API_BASE}/api/admin/upload`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });
                    const uploadData = await uploadRes.json();
                    imageUrl = uploadData.url;
                } catch (err) {
                    showToast('Image upload failed', 'error');
                    return;
                }
            }
            
            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_BASE}/api/admin/prompts/${id}` : `${API_BASE}/api/admin/prompts`;
            
            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        title, description, prompt, guideline,
                        image_url: imageUrl, category, status,
                        view_count: viewCount, love_count: loveCount, save_count: saveCount
                    })
                });
                
                if (res.ok) {
                    closeModal();
                    loadPrompts();
                    showToast(id ? 'Prompt updated!' : 'Prompt added!');
                } else {
                    showToast('Error saving prompt', 'error');
                }
            } catch (err) {
                showToast('Error saving prompt', 'error');
            }
        }

        // ============ DELETE PROMPT ============
        async function deletePrompt(id) {
            if (!confirm('Are you sure you want to delete this prompt?')) return;
            
            try {
                await fetch(`${API_BASE}/api/admin/prompts/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                loadPrompts();
                showToast('Prompt deleted');
            } catch (err) {
                showToast('Error deleting prompt', 'error');
            }
        }

        // ============ HELPERS ============
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.background = type === 'error' ? '#ef4444' : '#10b981';
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        // Close modal on overlay click
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
